
<!DOCTYPE html>
<html>
<head>
    <title>My CSS Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        .top-bar {
            background-color: blue;
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .profile-card {
            width: 250px;
            padding: 20px;
            margin: 20px;
            border: 2px solid blue;
            border-radius: 15px;
            text-align: center;
            background-color: #dbeafe;
            display: inline-block;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid blue;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 30px;
            color: blue;
        }

        .bio-box {
            width: 300px;
            height: 100px;
            padding: 15px;
            margin: 20px;
            border: 2px solid black;
            border-radius: 10px;
            overflow: auto;
            background-color: white;
        }

        .plus-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: green;
            color: white;
            font-size: 30px;
            border: none;
            z-index: 200;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <h2>My Website</h2>
    </div>

    <div class="profile-card">
        <div class="avatar">K</div>
        <h2>Karan Verma</h2>
        <p>Web Developer</p>
    </div>

    <div class="bio-box">
        My name is Karan Verma.
        I am a B.Tech student.
        I am learning HTML, CSS and Java.
        I want to become a web developer.
        I enjoy creating websites and learning
        new programming languages.
    </div>

    <button class="plus-button">+</button>

</body>
</html>
