
<!DOCTYPE html>
<html>
<head>
    <title>Flex Wrap Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 200px;
            background-color: white;
            border: 2px solid #2563eb;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .card h2 {
            color: blue;
            margin-bottom: 10px;
        }

        .card p {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>My Flexbox Cards</h1>

    <br>

    <div class="card-container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn HTML to create web pages.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn CSS to design websites.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn JavaScript to make websites interactive.</p>
        </div>

        <div class="card">
            <h2>Java</h2>
            <p>Learn Java programming language.</p>
        </div>

    </div>

</body>
</html>
