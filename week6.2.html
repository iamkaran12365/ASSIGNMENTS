
<!DOCTYPE html>
<html>
<head>
    <title>Profile Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .card {
            width: 250px;
            padding: 20px;
            margin: 20px;
            border: 2px solid;
            border-radius: 15px;
            text-align: center;
            display: inline-block;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .card1 {
            background-color: #dbeafe;
            border-color: blue;
        }

        .card1 .avatar {
            border-color: blue;
            color: blue;
        }

        .card2 {
            background-color: #dcfce7;
            border-color: green;
        }

        .card2 .avatar {
            border-color: green;
            color: green;
        }
    </style>
</head>
<body>

    <div class="card card1">
        <div class="avatar">K</div>
        <h2>Karan Verma</h2>
        <p>Web Developer</p>
    </div>

    <div class="card card2">
        <div class="avatar">K</div>
        <h2>Karan Verma</h2>
        <p>Web Developer</p>
    </div>

</body>
</html>
