
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Banner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .banner {
            height: 400px;
            background-color: #2563eb;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        .banner h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 20px;
        }

        .banner button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: white;
            color: blue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <section class="banner">

        <h1>Welcome to My Website</h1>

        <p>Learn HTML, CSS and Web Development</p>

        <button>Get Started</button>

    </section>

</body>
</html>
