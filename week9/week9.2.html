
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Images and Fonts</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    font-size: 1rem;
}

h1 {
    font-size: 2rem;
}

p {
    font-size: 1.2rem;
    line-height: 1.6;
}

.container {
    max-width: 800px;
    margin: auto;
}

img {
    max-width: 100%;
    height: auto;
    border: 3px solid black;
    border-radius: 10px;
}

.card {
    background-color: lightblue;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

.card h2 {
    font-size: 1.5rem;
}

    </style>
</head>

<body>

    <div class="container">

        <h1>Responsive Website</h1>

        <p>Learning Responsive Images and REM Font Sizes.</p>

        <div class="card">

            <h2>Beautiful Nature</h2>

            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Beautiful nature landscape">

            <p>This image automatically adjusts according to screen size.</p>

        </div>

    </div>

</body>
</html>
