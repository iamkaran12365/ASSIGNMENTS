
<!DOCTYPE html>
<html>
<head>
    <title>My Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navbar */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            padding: 20px 40px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        /* Banner */

        .banner {
            height: 450px;
            background-color: #2563eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .banner h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 20px;
        }

        .banner button {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: white;
            color: blue;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            
/* Mobile Responsive */

@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .banner h1 {
        font-size: 28px;
    }

    .banner p {
        font-size: 16px;
    }
}

/* Tablet Responsive */

@media (min-width: 601px) and (max-width: 900px) {
    .navbar {
        padding: 15px 20px;
    }

    .nav-links {
        gap: 15px;
    }

    .banner h1 {
        font-size: 34px;
    }
}

        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">MyWebsite</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

            <button class="nav-button">Login</button>
        </div>

    </nav>

    <!-- Banner -->

    <section class="banner">

        <h1>Welcome to My Website</h1>

        <p>Learn HTML, CSS and Web Development</p>

        <button>Get Started</button>

    </section>

</body>
</html>
